<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everymedic Pricelist 2026</title>
    <!-- رابط مكتبة Tailwind CSS للتنسيق السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* نظام الشبكة المخصص لتحكم أفضل في عدد الأعمدة */
        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px; /* زيادة المسافة بين العناصر */
            padding: 24px;
        }
        /* تنسيق إضافي لبطاقة المنتج لإضافة تأثير طفيف عند المرور */
        .product-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
    </style>
    <script>
        // إعدادات Tailwind مخصصة للألوان لتتناسب مع اللوجو
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'everymedic-blue': '#007BFF', // لون أزرق جذاب مستوحى من اللوجو
                        'accent-cyan': '#00BCD4', // لون سماوي مميز
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header احترافي مع اللوجو وحقل البحث -->
    <header class="bg-white shadow-lg p-4 sticky top-0 z-50">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <!-- اللوجو والعنوان -->
            <div class="flex items-center space-x-3">
                <img src="oaidalleapiprodscus.blob.core.windows.net" alt="Everymedic Logo" class="h-10 w-auto">
                <span class="text-2xl font-bold text-everymedic-blue">Everymedic</span>
                <h1 class="text-xl font-semibold text-gray-700 mr-4">قائمة الأسعار 2026</h1>
            </div>
            
            <!-- حقل البحث -->
            <input type="text" id="searchInput" placeholder="ابحث عن منتج بالاسم أو الملاحظات..." class="p-2 border border-gray-300 rounded-lg w-full md:w-80 focus:outline-none focus:ring-2 focus:ring-everymedic-blue focus:border-everymedic-blue">
        </div>
    </header>

    <main class="container mx-auto mt-8">
        
        <!-- بداية الجريد سيستم -->
        <div class="price-grid" id="products-container">
            <!-- سيتم إضافة المنتجات هنا تلقائياً بواسطة JavaScript -->
        </div>
    </main>

    <script>
        // البيانات المستخرجة من الإكسيل (بدون تغيير)
        const products =;

        const container = document.getElementById('products-container');
        const searchInput = document.getElementById('searchInput');

        // دالة لعرض المنتجات بناءً على معيار البحث
        function renderProducts() {
            container.innerHTML = ''; // مسح المحتوى الحالي
            const searchTerm = searchInput.value.toLowerCase();
            
            const filteredProducts = products.filter(product => {
                return product.name.toLowerCase().includes(searchTerm) ||
                       product.note.toLowerCase().includes(searchTerm);
            });

            filteredProducts.forEach(product => {
                container.innerHTML += `
                    <div class="product-card bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-56 object-cover">
                        <div class="p-5">
                            <h2 class="text-xl font-bold mb-2 text-gray-800">${product.name}</h2>
                            <p class="text-2xl font-extrabold text-accent-cyan mb-3">${product.price}</p>
                            <div class="bg-blue-50 p-3 rounded-lg text-sm text-gray-700 border-r-4 border-everymedic-blue">
                                <strong>ملاحظات:</strong> ${product.note}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // الاستماع لتغييرات حقل البحث وإعادة عرض المنتجات
        searchInput.addEventListener('input', renderProducts);

        // عرض المنتجات عند تحميل الصفحة لأول مرة
        renderProducts();
    </script>
    
</body>
</html>
