<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everymedic Pricelist 2026</title>
    <!-- رابط مكتبة Tailwind CSS للتنسيق السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* نظام الشبكة المخصص لتحكم أفضل في عدد الأعمدة */
        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px; /* زيادة المسافة بين العناصر */
            padding: 24px;
        }
        /* تنسيق إضافي لبطاقة المنتج لإضافة تأثير طفيف عند المرور */
        .product-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
    </style>
    <script>
        // إعدادات Tailwind مخصصة للألوان لتتناسب مع اللوجو
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'everymedic-blue': '#007BFF', // لون أزرق جذاب مستوحى من اللوجو
                        'accent-cyan': '#00BCD4', // لون سماوي مميز
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header احترافي مع اللوجو والاسم -->
    <header class="bg-white shadow-lg p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <!-- اللوجو -->
            <div class="flex items-center space-x-3">
                <!-- هنا تحتاج إلى رفع صورة اللوجو على الإنترنت واستخدام الرابط المباشر -->
                <!-- أنا استخدم رابط الصورة التي أرسلتها في استعلامك لأغراض توضيحية -->
                <img src="oaidalleapiprodscus.blob.core.windows.net" alt="Everymedic Logo" class="h-10 w-auto">
                <span class="text-2xl font-bold text-everymedic-blue">Everymedic</span>
            </div>
            <h1 class="text-xl font-semibold text-gray-700">قائمة الأسعار 2026</h1>
        </div>
    </header>

    <main class="container mx-auto mt-8">
        
        <!-- بداية الجريد سيستم -->
        <div class="price-grid" id="products-container">
            <!-- سيتم إضافة المنتجات هنا تلقائياً بواسطة JavaScript -->
        </div>
    </main>

    <script>
        // البيانات المستخرجة من الإكسيل (بدون تغيير)
        const products =;

        const container = document.getElementById('products-container');

        products.forEach(product => {
            container.innerHTML += `
                <div class="product-card bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
                    <img src="${product.image}" alt="${product.name}" class="w-full h-56 object-cover">
                    <div class="p-5">
                        <h2 class="text-xl font-bold mb-2 text-gray-800">${product.name}</h2>
                        <p class="text-2xl font-extrabold text-accent-cyan mb-3">${product.price}</p>
                        <div class="bg-blue-50 p-3 rounded-lg text-sm text-gray-700 border-r-4 border-everymedic-blue">
                            <strong>ملاحظات:</strong> ${product.note}
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
    
</body>
</html>
